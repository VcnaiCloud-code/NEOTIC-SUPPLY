kind = "web"
previewPath = "/"
title = "NEOTIC SUPPLY"
description = "A cinematic streetwear storefront for NEOTIC SUPPLY, featuring limited-edition tees, a character-led brand universe, and an interactive drop countdown."
version = "1.0.0"
id = "artifacts/neotic-supply"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20164

[services.development]
run = "pnpm --filter @workspace/neotic-supply run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/neotic-supply", "run", "build" ]
serve = "static"
publicDir = "artifacts/neotic-supply/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20164"
BASE_PATH = "/"
